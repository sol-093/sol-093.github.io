<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Food Selection</title>
    <link rel="stylesheet" href="css/food.css" />
  </head>
  <body>
    <div id="foodquestion">
      <b>Where do you like to eat?</b>
    </div>

    <div class="food-selection">
      <div class="food-item">
        <img src="food/unnamed.jpg" alt="Jollibee" />
        <label
          ><input
            type="checkbox"
            name="food"
            value="Burgers, fries and fried chicken"
          />
          Jollibee</label
        >
      </div>
      <div class="food-item">
        <img src="food/images.png" alt="dog" />
        <label
          ><input type="checkbox" name="food" value="hotdog" /> mcdo</label
        >
      </div>
      <div class="food-item">
        <img src="food/sodam-restaurant-15.webp" alt="koreanfood" />
        <label
          ><input type="checkbox" name="food" value="Korean food" /> Samgy
          </label
        >
      </div>
      <div class="food-item">
        <img src="food/Tokyo_Tokyo_logo.png" alt="pasta" />
        <label><input type="checkbox" name="food" value="pasta" /> tokyo tokyo</label>
      </div>
      <div class="food-item">
        <img src="food/Burger_King_2020.svg.png" alt="pizza" />
        <label><input type="checkbox" name="food" value="pizza" /> bk</label>
      </div>
      <div class="food-item">
        <img src="food/images.jpg" alt="salad" />
        <label><input type="checkbox" name="food" value="salad" /> cafe</label>
      </div>
      <div class="food-item">
        <img src="food/images (1).jpg" alt="steak" />
        <label><input type="checkbox" name="food" value="steak" /> street food</label>
      </div>
      <div class="food-item">
        <img src="food/images (2).jpg" alt="sushi" />
        <label><input type="checkbox" name="food" value="sushi" /> sa bahay</label>
      </div>
    </div>
    <button class="button" onclick="location.href='dessert.html'">
      Continue UWU
    </button>
  </body>
</html>
